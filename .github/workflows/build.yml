name: Build & Release DayFlow Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || \
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://repo.gradle.org/artifactory/libs-releases/org/gradle/gradle-wrapper/9.3.1/gradle-wrapper-9.3.1.jar || \
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Android APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/DayFlow-debug.apk \;
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apks/DayFlow-v${{ github.run_number }}.apk \;
          ls -la release-apks/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DayFlow App Build #${{ github.run_number }}
          body: |
            ## 📱 DayFlow Android Application
            Automated build from commit: ${{ github.sha }}

            ### 🚀 Download & Installation
            - Download the attached `.apk` file (`DayFlow-v${{ github.run_number }}.apk`) directly to your Android device.
            - Open the downloaded file to install or update DayFlow.
          files: |
            release-apks/DayFlow-v${{ github.run_number }}.apk
            release-apks/DayFlow-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
